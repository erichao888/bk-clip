name: 打包未签名 IPA

# 这个工作流的产出是「未签名 ipa」—— 它不是安装包，还差一道签名。
# 签名的活交给爱思助手，用你自己的 Apple ID（免费，7 天有效期）。
# 详见 release/爱思助手安装.md
#
# ⚠️ 目录约定：这个文件必须位于仓库根目录下的 .github/workflows/。
#    也就是说 —— **拿 bk-clip 这个文件夹的内容当仓库根目录**，
#    project.yml 和 .github/ 就自然对上了。如果把 bk-clip 当成子目录塞进仓库，
#    GitHub 根本扫不到这个工作流，Actions 页面会是空的。

on:
  # 手动触发是主要用法：Actions 页 → 选这个工作流 → Run workflow
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# 让所有脚本默认带 pipefail：管道里任何一个命令挂了，整步就红。
# 没有它，xcodebuild 失败会被后面的 tail 吞掉，步骤显示绿色但产物是空的 ——
# 那种「假成功」比直接红更浪费排查时间
defaults:
  run:
    shell: bash

jobs:
  build:
    # 公开仓库上 macOS runner 免费无限；私有仓库免费额度是 2000 分钟/月，
    # macOS 按 10 倍计费 ≈ 实际可用 200 分钟。一次构建约 6~10 分钟，够跑二三十次。
    # Free 计划默认消费上限是 $0，超额直接停任务，不会悄悄扣钱
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: 打印环境
        run: |
          xcodebuild -version
          sw_vers
          which brew

      - name: 安装 XcodeGen
        # HOMEBREW_NO_AUTO_UPDATE=1：跳过 brew 自我更新。CI 上那次更新
        # 经常一跑一两分钟，甚至因为网络抖动整个步骤挂掉，纯属陪葬
        run: |
          set -o pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen 2>&1 | tail -15
          xcodegen --version

      - name: 装转换依赖（尽力而为）
        # macOS 的 python3 不自带 pyyaml（run #3 实测：No module named 'yaml'）。
        # 【关键】这一步绝不能因为装不上就红 —— 那会让后面的诊断器根本跑不到，
        # 白跑一整轮。所以装不上只警告，真正兜底的是下一步里的 ruby：
        # macOS 自带 ruby，标准库就有 YAML 和 JSON，零安装、必可用
        run: |
          python3 -m pip install --quiet --user pyyaml 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages pyyaml 2>/dev/null \
            || pip3 install --quiet pyyaml 2>/dev/null \
            || echo "::warning::pyyaml 没装上，改用 ruby 兜底转换"
          python3 -c "import yaml; print('pyyaml 可用', yaml.__version__)" \
            || echo "pyyaml 不可用"
          ruby -e 'require "yaml"; require "json"; puts "ruby 兜底可用: #{RUBY_VERSION}"' \
            || echo "::warning::ruby 也不可用，转换只能靠 pyyaml"

      - name: 生成 Xcode 工程
        # 【为什么先转 JSON】run #2/#3 的报错 Decoding failed at "path": Nothing found
        # 出在「YAML 文本 → spec 对象」的解析段（Yams 库）。JSON 走的是同一个
        # Codable 终点但没有 Yams —— 用 JSON 能跑通就说明是 YAML 层的坑，
        # 跑不通则诊断器（同样走 JSON）会把肇事块直接点名
        run: |
          # 两条转换路径，谁先产出 project.json 用谁。都加了 || true：
          # 在 GitHub 的 bash（-eo pipefail）下，任一条失败都会让整步立刻退出，
          # 兜底就永远走不到
          python3 - <<'PYEOF' || true
          import yaml, json
          spec = yaml.safe_load(open('project.yml', encoding='utf-8'))
          with open('project.json', 'w', encoding='utf-8') as f:
              json.dump(spec, f, ensure_ascii=False, indent=2)
          print('project.json 已生成(python)，顶层键:', list(spec))
          PYEOF

          if [ ! -f project.json ]; then
            echo "python 路径没产出，改用 ruby 转换 ↓"
            ruby -ryaml -rjson -e '
              spec = YAML.load_file("project.yml")
              File.write("project.json", JSON.pretty_generate(spec) + "\n")
              puts "project.json 已生成(ruby)，顶层键: #{spec.keys.inspect}"
            ' || true
          fi

          if [ ! -f project.json ]; then
            echo "::error::yml -> json 转换全线失败，无法继续"
            exit 1
          fi

          xcodegen generate --spec project.json && {
            echo "=== 生成成功，工程里的 scheme： ==="
            xcodebuild -list -project BKClip.xcodeproj || true
            exit 0
          }
          echo "::error::XcodeGen 生成失败（JSON 路径），开始自动分块定位 ↓"
          python3 - <<'PYEOF'
          import subprocess, json, os, glob

          spec = json.load(open('project.json', encoding='utf-8'))

          def try_spec(tag, s):
              # XcodeGen 以「spec 文件所在目录」解析相对路径，
              # 临时 spec 必须放仓库根下，放 /tmp 会让 sources 假失败
              p = f'spec_bisect_{tag}.json'
              outdir = f'/tmp/bisect/{tag}'
              os.makedirs(outdir, exist_ok=True)
              with open(p, 'w', encoding='utf-8') as f:
                  json.dump(s, f, ensure_ascii=False, indent=2)
              r = subprocess.run(
                  ['xcodegen', 'generate', '--spec', p, '--project', f'/tmp/bisect/{tag}'],
                  capture_output=True, text=True)
              out = (r.stdout + r.stderr).strip().splitlines()
              tail = ' | '.join(out[-3:]) if out else ''
              print(f"  [{tag}] -> {'OK' if r.returncode == 0 else 'FAIL: ' + tail}")
              os.remove(p)

          name = spec.get('name', 'BKClip')
          try_spec('1_name_only', {'name': name})
          if 'options' in spec:
              try_spec('2_name_options', {'name': name, 'options': spec['options']})
          if 'settings' in spec:
              try_spec('3_name_settings', {'name': name, 'settings': spec['settings']})

          t = spec.get('targets', {}).get('BKClip', {})
          core = {'name': name, 'targets': {'BKClip': {'type': 'application', 'platform': 'iOS'}}}
          try_spec('4_target_bare', core)
          for i, src in enumerate(t.get('sources', [])):
              try_spec(f'5_source_{i}', {**core, 'targets': {'BKClip': {**core['targets']['BKClip'], 'sources': [src]}}})
          if 'settings' in t:
              try_spec('6_target_settings', {**core, 'targets': {'BKClip': {**core['targets']['BKClip'], 'settings': t['settings']}}})
          if 'info' in t:
              try_spec('7_target_info', {**core, 'targets': {'BKClip': {**core['targets']['BKClip'], 'info': t['info']}}})
          if 'schemes' in t:
              try_spec('8_target_schemes', {**core, 'targets': {'BKClip': {**core['targets']['BKClip'], 'schemes': t['schemes']}}})
          try_spec('9_full', spec)
          for f in glob.glob('spec_bisect_*.json'): os.remove(f)
          print("（从上往下，第一个 FAIL 的块就是肇事者）")
          PYEOF
          exit 1

      # 这一步防护来自真实踩坑：PRODUCT_NAME 一旦写回中文，
      # 打出来的 Payload 里就是「bk剪辑.app」，爱思重签会报「错误码 45」，
      # 而那个提示完全不提中文的事 —— 与其以后花两小时排这个，不如在这里断掉
      - name: 检查 PRODUCT_NAME 必须是纯 ASCII
        run: |
          NAME=$(grep -m1 '^        PRODUCT_NAME:' project.yml | awk '{print $2}')
          echo "PRODUCT_NAME = [$NAME]"
          if [ -z "$NAME" ]; then
            echo "::error::没从 project.yml 里取到 PRODUCT_NAME，检查缩进是不是变了"
            exit 1
          fi
          if [ "$NAME" != "BKClip" ]; then
            echo "::error::PRODUCT_NAME 必须是 ASCII 的 BKClip，中文包名会导致爱思签名报错误码 45"
            exit 1
          fi

      - name: 编译（不签名）
        # tee 落盘完整日志：失败时只打最后 60 行，但完整版留在文件里
        # 可以在下一步或者打包前再翻。管道 + pipefail 保证真实退出码不被吞
        run: |
          set -o pipefail
          xcodebuild \
            -project BKClip.xcodeproj \
            -scheme BKClip \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_COMPILATION_MODE=wholemodule \
            2>&1 | tee xcodebuild.log | grep -E "error|warning: |BUILD|note: " | tail -60
          status=${PIPESTATUS[0]}
          echo "xcodebuild 退出码 $status"
          [ "$status" = "0" ] || {
            echo "====== 失败日志最后 80 行 ======"
            tail -80 xcodebuild.log
            exit 1
          }

      # ipa 的本质就是一个 zip：里面一层 Payload，Payload 里一个 .app。
      # 没有别的魔法，这也是为什么它能被爱思拿去重签
      - name: 打包 ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "::error::没找到编译产物 .app"; exit 1; fi
          echo "产物：$APP"
          du -sh "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          # -y 保留符号链接。App bundle 内部的软链丢了，签名必失败
          zip -qry bkClip-unsigned.ipa Payload
          ls -lh bkClip-unsigned.ipa
          # 排错用：确认 Payload 里确实装进去了，且名字是英文
          unzip -l bkClip-unsigned.ipa | head -8

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: bkClip-unsigned-ipa
          path: bkClip-unsigned.ipa
          retention-days: 30
